<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabler</title>
  <link rel="icon" type="image/svg+xml" href="./logo-icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@600;700&family=Space+Grotesk:wght@600;700&family=Syne:wght@700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  
  <!-- Firebase SDK (v11 - inherited correctly from @tabler) -->
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js";
    import {
      getDatabase,
      ref,
      set,
      onValue,
      push,
      get,
      remove
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDhYTiWflm90SZTySJMDlBpGu7WHzkUaL4",
      authDomain: "manager-8ac68.firebaseapp.com",
      databaseURL: "https://manager-8ac68-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "manager-8ac68",
      storageBucket: "manager-8ac68.firebasestorage.app",
      messagingSenderId: "978586727124",
      appId: "1:978586727124:web:34e5fe89cc51f35b37c141",
      measurementId: "G-XPC0DXSBNZ"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);
    
    // Expose globally
    window.firebase = { app, analytics, db, ref, set, onValue, push, get, remove };
    console.log('Firebase v11 initialized successfully');
  </script>
</head>
  <body>
  <!-- Unified header (statistics + tabs) -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">Tabler</h1>
      <div class="summary-stats">
        <div class="stat-card">
          <div class="stat-label">Overall Progress</div>
          <div class="stat-value" id="overallProgress">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Current Week</div>
          <div class="stat-value" id="currentWeekDisplay">Week 0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Open Tasks</div>
          <div class="stat-value" id="incompleteTasksCount">0</div>
        </div>
      </div>
    </div>
    <div class="header-right">
      <div class="tabs">
        <div class="tab active" data-tab="timetable">Timetable</div>
        <div class="tab" data-tab="tasks">Tasks</div>
        <div class="tab" data-tab="manage">Manage</div>
      </div>
    </div>
  </header>
  
  <!-- Timetable tab -->
  <div class="tab-content active" id="timetable-tab">
    <div class="timetable" id="timetable">
      <!-- Timetable content is generated by JavaScript -->
    </div>
  </div>
  
  <!-- Tasks tab -->
  <div class="tab-content" id="tasks-tab">
    <div class="task-list">
      <div id="active-tasks">
        <!-- Incomplete tasks are shown here -->
      </div>
      <div class="completed-tasks">
        <h3>Completed Tasks</h3>
        <div id="completed-tasks">
          <!-- Completed tasks are shown here -->
        </div>
      </div>
    </div>
  </div>
  
  <!-- Manage tab -->
  <div class="tab-content" id="manage-tab">
    <div class="manage-container">
      <!-- Semester management section -->
      <section class="manage-section">
        <h2 class="manage-section-title">Semester Management</h2>
        <div class="manage-actions">
          <button id="addSemesterBtn" class="btn primary">Add Semester</button>
        </div>
        <div id="semestersList" class="semesters-list">
          <!-- Semester list is shown here -->
        </div>
      </section>
      
    </div>
  </div>

  
  
  <!-- Unified modal (task management + progress management) -->
  <div id="taskModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-header-title-row">
          <h2 id="modalTitle">Subject Management</h2>
          <div class="modal-evaluation-wrap">
            <span id="modalEvaluation" class="modal-evaluation"></span>
            <input type="text" id="modalEvaluationInput" class="modal-evaluation-input" placeholder="評価を自由に入力" style="display: none;">
            <button type="button" id="modalEvaluationEditBtn" class="modal-evaluation-edit-btn" title="評価を編集" aria-label="評価を編集">✎</button>
          </div>
        </div>
        <p id="modalSubtitle">Task creation and progress management</p>
      </div>

      <!-- Progress management section -->
      <div class="progress-section">
        <div class="action-buttons">
          <button id="understandBtn" class="btn primary large">
            Understood!
          </button>
          <button id="ununderstandBtn" class="btn secondary large">
            Undo
          </button>
        </div>
      </div>
      
      <!-- Study time section removed -->
      <!-- Original time-selector-section, time-add-buttons, and time-custom-input have been removed -->
      
      <!-- Divider -->
      <div class="section-divider"></div>
      
      <!-- Task creation section -->
      <div class="task-section" id="taskSection">
        <form id="taskForm">
          <div class="form-group">
            <label>Task Type</label>
            <div class="task-type-buttons">
              <button type="button" class="task-type-btn active" data-type="Assignment">Assignment</button>
              <button type="button" class="task-type-btn" data-type="Report">Report</button>
              <button type="button" class="task-type-btn" data-type="Test">Test</button>
            </div>
          </div>
          <div class="form-group">
            <label for="taskContent">Details</label>
            <input type="text" id="taskContent">
          </div>
          <div class="form-group">
            <label>Due Date</label>
            <div class="date-buttons">
              <button type="button" onclick="setDate('previous')">Previous Class</button>
              <button type="button" onclick="setDate('nextMinusOne')">Day Before Next</button>
              <button type="button" onclick="setDate('next')">Next Class</button>
              <button type="button" onclick="setDate('nextWeekMinusOne')">2 Weeks Minus 1</button>
            </div>
            <input type="date" id="taskDate" required>
          </div>
          <button type="submit" class="submit-button" id="taskSubmitBtn">Add Task</button>
        </form>
      </div>
      
      <div class="modal-actions">
        <button id="cancelModalBtn" class="btn">Close</button>
      </div>
    </div>
  </div>
  
  <!-- Class days management modal -->
  <div id="classDaysModal" class="modal">
    <div class="modal-content large-modal">
      <div class="modal-header">
        <h2>Class Days Management</h2>
        <button class="modal-close-btn" id="closeClassDaysModal">×</button>
      </div>
      <div class="modal-body">
        <div class="classdays-simple-header">
          <div id="semesterInfo" class="semester-info-simple"></div>
          <div id="semesterDateEdit" class="semester-date-edit" style="display: none;">
            <div class="date-edit-group">
              <label for="editStartDate">Start Date:</label>
              <input type="date" id="editStartDate" class="date-input">
            </div>
            <div class="date-edit-group">
              <label for="editEndDate">End Date:</label>
              <input type="date" id="editEndDate" class="date-input">
            </div>
            <div class="date-edit-actions">
              <button id="saveDatesBtn" class="btn btn-small btn-primary">Save</button>
              <button id="cancelDatesBtn" class="btn btn-small">Cancel</button>
            </div>
          </div>
        </div>
        
        <div class="calendar-controls-simple">
          <button id="prevMonthBtn" class="btn btn-small">◀</button>
          <span id="currentMonthDisplay" class="month-display"></span>
          <button id="nextMonthBtn" class="btn btn-small">▶</button>
        </div>
        
        <div id="classDaysCalendar" class="class-days-calendar">
          <!-- Calendar is shown here -->
        </div>
      </div>
    </div>
  </div>
  
  <!-- Timetable editor modal -->
  <div id="timetableModal" class="modal">
    <div class="modal-content large-modal">
      <div class="modal-header">
        <h2>Timetable Management</h2>
        <button class="modal-close-btn" id="closeTimetableModal">×</button>
      </div>
      <div class="modal-body">
        <div id="timetableEditor" class="timetable-editor">
          <!-- Timetable editor is shown here -->
        </div>
        <div class="timetable-actions">
          <button id="saveTimetableBtn" class="btn primary">Save</button>
          <button id="cancelTimetableBtn" class="btn">Cancel</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Script loading -->
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>

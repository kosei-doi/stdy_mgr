<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="appIconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="512" cy="512" r="512" fill="url(#backgroundGradient)"/>

  <!-- Icon content scaled to fit nicely -->
  <g transform="translate(192, 192) scale(0.64)">
    <!-- Simplified grid for icon - scaled up -->
    <rect x="40" y="60" width="60" height="50" rx="8" fill="url(#appIconGradient)" opacity="0.9"/>
    <rect x="110" y="60" width="60" height="50" rx="8" fill="url(#appIconGradient)" opacity="0.7"/>
    <rect x="180" y="60" width="60" height="50" rx="8" fill="url(#appIconGradient)" opacity="0.5"/>
    <rect x="250" y="60" width="60" height="50" rx="8" fill="url(#appIconGradient)" opacity="0.3"/>

    <rect x="40" y="120" width="60" height="50" rx="8" fill="url(#appIconGradient)" opacity="0.8"/>
    <rect x="110" y="120" width="60" height="50" rx="8" fill="url(#appIconGradient)" opacity="0.6"/>
    <rect x="180" y="120" width="60" height="50" rx="8" fill="url(#appIconGradient)" opacity="0.4"/>
    <rect x="250" y="120" width="60" height="50" rx="8" fill="url(#appIconGradient)" opacity="0.2"/>

    <rect x="40" y="180" width="60" height="50" rx="8" fill="url(#appIconGradient)" opacity="0.9"/>
    <rect x="110" y="180" width="60" height="50" rx="8" fill="url(#appIconGradient)" opacity="0.7"/>
    <rect x="180" y="180" width="60" height="50" rx="8" fill="url(#appIconGradient)" opacity="0.5"/>
    <rect x="250" y="180" width="60" height="50" rx="8" fill="url(#appIconGradient)" opacity="0.3"/>

    <!-- Progress bar -->
    <rect x="40" y="240" width="60" height="8" rx="4" fill="url(#appIconGradient)"/>
  </g>
</svg>
